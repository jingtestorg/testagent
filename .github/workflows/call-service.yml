name: Trigger IAS-Protected Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub OIDC token and exchange for IAS token
        id: ias_token
        env:
          SCI_TENANT_URL: ${{ vars.IAS_TENANT_URL }}
          SCI_CLIENT_ID: ${{ secrets.IAS_CLIENT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.parse

          sci_tenant_url = os.environ.get("SCI_TENANT_URL", "").strip()
          sci_client_id  = os.environ.get("SCI_CLIENT_ID", "").strip()
          github_output  = os.environ["GITHUB_OUTPUT"]

          if not sci_tenant_url:
              print("Error: IAS_TENANT_URL variable is not set or empty in GitHub org/repo variables")
              sys.exit(1)
          if not sci_client_id:
              print("Error: IAS_CLIENT_ID variable is not set or empty in GitHub org/repo variables")
              sys.exit(1)
          print(f"Using IAS tenant: {sci_tenant_url}")

          # Step 1: get short-lived GitHub OIDC JWT
          req = urllib.request.Request(
              f"{os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']}&audience={sci_tenant_url}",
              headers={
                  "Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}",
                  "Accept": "application/json; api-version=2.0",
              },
          )
          with urllib.request.urlopen(req) as resp:
              github_jwt = json.loads(resp.read())["value"]

          # Step 2: exchange GitHub JWT for IAS token using client_assertion (no client secret needed)
          payload = urllib.parse.urlencode({
              "grant_type": "client_credentials",
              "client_id": sci_client_id,
              "client_assertion_type": "urn:ietf:params:oauth:client-assertion-type:jwt-bearer",
              "client_assertion": github_jwt,
          }).encode()

          req = urllib.request.Request(
              f"{sci_tenant_url}/oauth2/token",
              data=payload,
              method="POST",
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  response = json.loads(resp.read())
          except urllib.error.HTTPError as e:
              print(f"Error: IAS token request failed {e.code}: {e.read().decode()}")
              sys.exit(1)

          ias_token = response.get("access_token")
          if not ias_token:
              print(f"Error: no access_token in response: {response}")
              sys.exit(1)

          print("IAS token successfully retrieved")
          print(f"::add-mask::{ias_token}")
          with open(github_output, "a") as f:
              f.write(f"ias_token={ias_token}\n")
          EOF

      - name: Call IAS-protected backend service
        run: |
          HTTP_STATUS=$(curl -sSL -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ vars.SERVICE_URL }}/trigger" \
            -H "Authorization: Bearer ${{ steps.ias_token.outputs.ias_token }}" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions","ref":"${{ github.ref }}","sha":"${{ github.sha }}"}')

          echo "HTTP status: $HTTP_STATUS"
          echo "Response: $(cat /tmp/response.json)"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Service call failed with HTTP $HTTP_STATUS"
            exit 1
          fi

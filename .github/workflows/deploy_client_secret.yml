name: Deploy to Joule Studio (Client Secret)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Joule Studio CLI
        uses: ./.github/actions/setup-jl

      - name: Fetch SCI token via client secret
        id: fetch-token
        shell: bash
        env:
          SCI_TENANT_URL: ${{ secrets.SCI_TENANT_URL }}
          SCI_CLIENT_ID: ${{ secrets.SCI_CLIENT_ID }}
          SCI_CLIENT_SECRET: ${{ secrets.SCI_CLIENT_SECRET }}
        run: |
          response=$(curl -s -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=${SCI_CLIENT_ID}" \
            -d "client_secret=${SCI_CLIENT_SECRET}" \
            -d "resource=urn:sap:identity:application:provider:name:build" \
            "${SCI_TENANT_URL}/oauth2/token")

          sci_token=$(echo "$response" | jq -r '.access_token')
          if [[ -z "$sci_token" || "$sci_token" == "null" ]]; then
            echo "Error: sci_token was not retrieved"
            echo "Response: $response"
            exit 1
          fi

          echo "sci_token successfully retrieved"
          echo "::add-mask::${sci_token}"
          echo "sciToken=${sci_token}" >> "$GITHUB_OUTPUT"

      - name: Build solution
        id: build-solution
        uses: ./.github/actions/build

      - name: Deploy solution
        uses: ./.github/actions/deploy
        with:
          sciToken: ${{ steps.fetch-token.outputs.sciToken }}
          jouleStudioUrl: ${{ secrets.JOULE_STUDIO_URL }}
          solutionZip: ${{ steps.build-solution.outputs.solutionZip }}

name: Setup Joule Studio CLI
description: Installs Node.js and the Joule Studio developer CLI tool.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Install Joule Studio CLI
      shell: bash
      #TODO: print version
      run: npm install -g @sap/joule-work-dev-cli-early-adopters@prerelease --registry https://int.repositories.cloud.sap/artifactory/api/npm/build-milestones-npm/
